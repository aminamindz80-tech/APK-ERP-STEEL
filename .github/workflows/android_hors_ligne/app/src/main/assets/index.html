let cur='home';
function nav(){$('#nav').innerHTML=[['home','Accueil'],...Object.entries(S).map(([k,v])=>[k,v[0]])].map(([k,l])=>`<button class="${k===cur?'on':''}" data-k="${k}">${l}</button>`).join('');
 document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{cur=b.dataset.k;nav();show()})}
function show(){const m=$('#m');
 if(cur==='home'){const al=D.articles.filter(a=>(a.stock_mini||0)>0&&(a.stock||0)<=a.stock_mini);
  m.innerHTML=`<div class="g">${Object.entries(S).filter(([k])=>k!=='mouvements').map(([k,v])=>`<div class="k"><b>${v[2].length}</b>${v[0]}</div>`).join('')}</div><p class="ft">Application en lecture seule, sans connexion réseau. Les données sont celles de l'export du ${esc(D.date)}.</p>`;return}
 const [t,cols,rows,det]=S[cur];
 m.innerHTML=`<input id="q" placeholder="Rechercher dans ${t.toLowerCase()}…"><div class="box" id="bx"></div><p class="ft" id="cnt"></p>`;
 const draw=()=>{const v=$('#q').value.toLowerCase(),sel=rows.filter(r=>JSON.stringify(r).toLowerCase().includes(v));
  $('#bx').innerHTML=tb(cols,sel,det?'c':'').replace(/<\/tbody>/,'</tbody>');$('#cnt').textContent=sel.length+' ligne(s)';
  if(cur==='articles')document.querySelectorAll('#bx tbody tr').forEach((tr,i)=>{const a=sel[i];if((a.stock_mini||0)>0&&(a.stock||0)<=a.stock_mini)tr.classList.add('al')});
  if(det)document.querySelectorAll('#bx tbody tr.c').forEach((tr,i)=>tr.onclick=()=>{const nx=tr.nextElementSibling;if(nx&&nx.classList.contains('d'))return nx.remove();
   const r=sel[i],x=document.createElement('tr');x.className='d';x.innerHTML=`<td colspan="${cols.length}">${r.remarque?`<div style="padding:8px">${esc(r.remarque).replace(/\n/g,'<br>')}</div>`:''}${tb(det,r.lignes)}</td>`;tr.after(x)})};
 $('#q').oninput=draw;draw()}
$('#soc').textContent=D.societe;$('#sub').textContent='Consultation hors ligne - données du '+D.date;nav();show();
</script></body></html>
